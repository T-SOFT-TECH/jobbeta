<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Scroll reveals hide content until it scrolls in, so only opt in when motion is allowed,
			// and give up if the reveal script hasn't started in time (content must never stay hidden)
			(function () {
				var root = document.documentElement;
				if (!('IntersectionObserver' in window)) return;
				if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
				root.classList.add('reveal');
				setTimeout(function () {
					if (!window.__revealReady) root.classList.remove('reveal');
				}, 4000);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
